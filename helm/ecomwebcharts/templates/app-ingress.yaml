{{- if eq .Values.ingressType "istio" }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
 name: istio-ingressgateway
 namespace: aks-istio-ingress
spec:
 selector:
   istio: aks-istio-ingressgateway-external
 servers:
 - port:
     number: 80
     name: http
     protocol: HTTP
   hosts:
   - '*'
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
 name: ecom-web
 namespace: default
spec:
 hosts:
   - "*"
 gateways:
   - aks-istio-ingress/istio-ingressgateway
 http:
 - match:
   - uri:
       prefix: "/"
   route:
   - destination:
       host: "ecom-web-service.default.svc.cluster.local"
       port:
         number: 80
{{- else if eq .Values.ingressType "alb" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
 name: ecom-web-ingress
 annotations:
   alb.ingress.kubernetes.io/scheme: internet-facing
   alb.ingress.kubernetes.io/target-type: ip
spec:
 ingressClassName: alb
 rules:
   - http:
       paths:
       - path: /
         pathType: Prefix
         backend:
           service:
             name: ecom-web-service
             port:
               number: 80
{{- else if eq .Values.ingressType "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: aws-alb
spec:
  controllerName: eks.amazonaws.com/alb
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ecom-web-gateway
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  gatewayClassName: aws-alb
  listeners:
  - name: http
    port: 80
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ecom-web-route
spec:
  parentRefs:
  - name: ecom-web-gateway
  rules:
  - backendRefs:
    - name: ecom-web-service
      port: 80
{{- end }}
